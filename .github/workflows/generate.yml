name: Generate List CI

on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * *'

permissions: {}

# A manual run while the scheduled one is still going would race it to push and publish.
concurrency:
  group: generate
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the data commit and release tag
      id-token: write # npm OIDC trusted publishing + provenance

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Configure git identity
        run: |
          git config user.email "${{ secrets.GIT_USER_EMAIL }}"
          git config user.name "${{ secrets.GIT_USER_NAME }}"

      - run: npm ci
      # Downloads the IANA list, ICANN's gTLD registry, IANA's RDAP bootstrap and the special-use
      # registry; fails (and so publishes nothing) on any HTTP error or a truncated list. Also writes
      # a commit message naming the TLDs added, removed or changed since the last run.
      - run: npm run generate -- --message "$RUNNER_TEMP/commit-message.txt"
      - run: npm run build
      - run: npm test

      # `exit 0` only ends this step, so the release steps below must be gated on
      # this step's output; otherwise an unchanged list is still released daily.
      - name: Commit if changed
        id: commit
        run: |
          git add .
          if git diff --staged --quiet; then
            echo "No changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -F "$RUNNER_TEMP/commit-message.txt"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Release
        if: steps.commit.outputs.changed == 'true'
        run: npm run release

      - name: Push commit + tags
        if: steps.commit.outputs.changed == 'true'
        run: git push --follow-tags

      - name: Publish to npm
        if: steps.commit.outputs.changed == 'true'
        run: npm publish
        env:
          CI: true
